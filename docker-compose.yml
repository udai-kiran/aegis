name: aegis-trader

networks:
  internal:
    driver: bridge
    internal: true
  execution:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:

x-defaults: &service-defaults
  restart: unless-stopped

services:
  # Core infrastructure
  postgres:
    <<: *service-defaults
    image: postgres:18-alpine
    container_name: aegis-postgres
    networks:
      - internal
      - execution
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis} -d ${POSTGRES_DB:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    <<: *service-defaults
    image: valkey/valkey:8-alpine
    container_name: aegis-valkey
    networks:
      - internal
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: valkey-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  minio:
    <<: *service-defaults
    image: minio/minio:latest
    container_name: aegis-minio
    networks:
      - internal
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aegis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Reverse proxy
  traefik:
    <<: *service-defaults
    image: traefik:v3.1
    container_name: aegis-traefik
    networks:
      - external
      - internal
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Services
  api-gateway:
    <<: *service-defaults
    build:
      context: ./services/api-gateway
    container_name: aegis-api-gateway
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aegis}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aegis}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.services.api.loadbalancer.server.port=8000

  market-data:
    <<: *service-defaults
    build:
      context: ./services/market-data
    container_name: aegis-market-data
    networks:
      - internal
      - external
    profiles:
      - phase3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  strategy-engine:
    <<: *service-defaults
    build:
      context: ./services/strategy-engine
    container_name: aegis-strategy-engine
    networks:
      - internal
    profiles:
      - phase2
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  intelligence:
    <<: *service-defaults
    build:
      context: ./services/intelligence
    container_name: aegis-intelligence
    networks:
      - internal
    profiles:
      - phase5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  portfolio-manager:
    <<: *service-defaults
    build:
      context: ./services/portfolio-manager
    container_name: aegis-portfolio-manager
    networks:
      - internal
    profiles:
      - phase3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  risk-manager:
    <<: *service-defaults
    build:
      context: ./services/risk-manager
    container_name: aegis-risk-manager
    networks:
      - internal
      - execution
    profiles:
      - phase3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  execution-engine:
    <<: *service-defaults
    build:
      context: ./services/execution-engine
    container_name: aegis-execution-engine
    networks:
      - execution
      - external
    profiles:
      - phase4
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
