# Aegis Trader - Redis configuration

# Persistence
appendonly yes
appendfsync everysec

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Security - protected-mode off because Redis is on an internal-only network
# with no host-port exposure in production. Add requirepass when needed.
protected-mode no

# Networking
tcp-keepalive 300
timeout 0

# Logging
loglevel notice