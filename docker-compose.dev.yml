# Development overrides - exposes service ports to host for debugging
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api-gateway:
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: debug

  web-ui:
    ports:
      - "3000:80"
